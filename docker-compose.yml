version: "3.9"

x-app: &app
  build: .
  env_file: .env
  # comment out the next line if you don't want source mounted read-only
  # (kept only for the ETL service below)
  # volumes:
  #   - .:/app:ro
  init: true

services:
  anthropic:
    <<: *app
    command: python main.py

  gpt:
    <<: *app
    command: python main_openai.py

  etl:
    <<: *app
    command: python run_etl_eval.py
    # mount source read-only for quick edits without rebuilds
    volumes:
      - .:/app:ro
